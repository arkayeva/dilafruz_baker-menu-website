<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mening menyum — salatlar va pishiriqlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#FDFBF1;--ink:#1E211C;--mute:#7C8176;--line:#E4DFC8;--accent:#2F4A3A;--sun:#F2C94C;--sunt:#FBF0C4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.65 Jost,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 24px 96px}
h1{font:500 clamp(40px,8vw,64px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 12px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 48px;max-width:46ch}
.bar{display:flex;gap:24px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs{display:flex;gap:28px;flex:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.tab{font:500 26px "Cormorant Garamond",Georgia,serif;color:var(--mute);padding:8px 0 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tools{display:flex;gap:16px;align-items:center;padding-bottom:8px}
input[type=search]{font:inherit;border:0;border-bottom:1px solid var(--line);background:none;padding:4px 0;width:150px;color:var(--ink)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.fav-toggle{color:var(--mute);font-size:15px}
.fav-toggle[aria-pressed=true]{color:var(--accent);font-weight:500}
ul{list-style:none;margin:0;padding:0}
.item{border-bottom:1px solid var(--line)}
.head{width:100%;display:flex;align-items:baseline;gap:12px;text-align:left;padding:22px 0}
.name{font:500 28px/1.2 "Cormorant Garamond",Georgia,serif}
.dots{flex:1;border-bottom:1px dotted var(--mute);transform:translateY(-5px);min-width:16px;opacity:.6}
.time{color:var(--mute);font-size:15px;white-space:nowrap}
.short{margin:-14px 0 20px;color:var(--mute);font-size:15.5px;max-width:52ch}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .body{grid-template-rows:1fr}
.inner{overflow:hidden}
.cols{display:grid;grid-template-columns:1fr 1.5fr;gap:32px;padding:4px 0 28px}
h3{font:500 20px "Cormorant Garamond",Georgia,serif;margin:0 0 8px;color:var(--accent)}
.cols ul li{padding:3px 0;font-size:16px}
ol{margin:0;padding-left:20px}ol li{padding:3px 0 6px 4px;font-size:16px}
ol li::marker{color:var(--accent);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px}
.star{font-size:15px;color:var(--mute);margin-bottom:24px}
.star[aria-pressed=true]{color:var(--accent);font-weight:500}
.empty{color:var(--mute);padding:32px 0}
footer{margin-top:56px;color:var(--mute);font-size:14px}
.xl{display:inline-block;margin:-34px 0 40px;color:var(--accent);font-weight:500;font-size:15px;border-bottom:1px solid var(--sun)}
.send{margin-left:18px;color:var(--accent);font-size:15px;text-decoration:underline}
.stk-row{display:flex;gap:14px;margin-bottom:28px}
.sticker{flex:none;align-self:center;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--sunt);border:1.5px dashed var(--sun);font-size:22px;line-height:1;transform:rotate(-7deg)}
.item:nth-child(even) .sticker{transform:rotate(6deg)}
.sticker.big{width:56px;height:56px;font-size:30px}
.stk-row .sticker:nth-child(2){transform:rotate(8deg)}.stk-row .sticker:nth-child(4){transform:rotate(9deg)}
.chips{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0 6px}
.chip{font-size:14.5px;padding:3px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--sunt);border-color:var(--sun);color:var(--ink);font-weight:500}
.add{color:var(--accent);font-weight:500;font-size:15px;border-bottom:1px solid var(--sun)}
.del{margin-left:18px;color:var(--mute);font-size:15px;text-decoration:underline}
dialog{width:calc(100% - 32px);max-width:560px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:28px;border-radius:4px}
dialog::backdrop{background:rgba(30,33,28,.35)}
dialog h2{font:500 32px "Cormorant Garamond",Georgia,serif;margin:0 0 16px}
dialog label,dialog legend{display:block;font-size:15px;color:var(--mute);margin:14px 0 4px;padding:0}
dialog fieldset{border:0;margin:0;padding:0}
dialog input[type=text],dialog textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:4px}
dialog textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:18px;flex-wrap:wrap}.row .col{flex:1;min-width:140px}
.radios{display:flex;gap:20px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;color:var(--ink);margin:0;font-size:16px}
.actions{display:flex;gap:20px;align-items:center;margin-top:24px}
.save{background:var(--accent);color:#fff;padding:9px 22px;border-radius:4px;font-weight:500}
.cancel{color:var(--mute)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:560px){.cols{grid-template-columns:1fr}.name{font-size:24px}.tools{width:100%}input[type=search]{flex:1}}
@media(prefers-reduced-motion:reduce){.body{transition:none}}
@media print{.bar .tools,.star{display:none}.item .body{grid-template-rows:1fr}}
</style>
</head>
<body>
<main>
  <div class="stk-row" aria-hidden="true"><span class="sticker big">🥗</span><span class="sticker big">🍰</span><span class="sticker big">🍋</span><span class="sticker big">🧁</span></div>
  <h1>Mening menyum</h1>
  <p class="lead">Kundalik salatlar va uy pishiriqlari. Taomni bosing — masalliqlar va tayyorlash tartibi ochiladi.</p>

  <a class="xl" href="mijozlar/">Mijozlar menyusini ochish</a>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-type="salad" aria-selected="true">Salatlar</button>
      <button class="tab" role="tab" data-type="bake" aria-selected="false">Pishiriqlar</button>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Qidirish" aria-label="Qidirish">
      <button class="fav-toggle" id="favOnly" aria-pressed="false">Sevimlilar</button>
      <button class="add" id="addBtn">+ Retsept qo‘shish</button>
    </div>
  </div>

  <div class="chips">
    <button class="chip" data-region="all" aria-pressed="true">Hammasi</button>
    <button class="chip" data-region="uz" aria-pressed="false">O‘zbekcha</button>
    <button class="chip" data-region="eu" aria-pressed="false">Yevropacha</button>
  </div>

  <ul id="list"></ul>
  <footer>O‘zingiz qo‘shgan retseptlar shu qurilmadagi brauzerda saqlanadi.</footer>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <form id="f">
    <h2 id="dt">Yangi retsept</h2>
    <fieldset><legend>Qaysi bo‘limga qo‘shilsin?</legend>
      <div class="radios">
        <label><input type="radio" name="type" value="salad" checked> Salatlar</label>
        <label><input type="radio" name="type" value="bake"> Pishiriqlar</label>
      </div></fieldset>
    <fieldset><legend>Yo‘nalishi</legend>
      <div class="radios">
        <label><input type="radio" name="region" value="uz" checked> O‘zbekcha</label>
        <label><input type="radio" name="region" value="eu"> Yevropacha</label>
      </div></fieldset>
    <label for="fn">Taom nomi</label>
    <input type="text" id="fn" name="name" required maxlength="60">
    <div class="row">
      <div class="col"><label for="ft">Tayyorlash vaqti</label><input type="text" id="ft" name="time" placeholder="masalan, 30 daqiqa" maxlength="30"></div>
      <div class="col"><label for="fe">Stiker (emoji)</label><input type="text" id="fe" name="e" placeholder="🥗" maxlength="4"></div>
    </div>
    <label for="fs">Qisqa tavsif</label>
    <input type="text" id="fs" name="short" maxlength="120">
    <label for="fi">Masalliqlar (har bir qatorga bittadan)</label>
    <textarea id="fi" name="ing" required placeholder="2 ta pomidor&#10;1 ta bodring"></textarea>
    <label for="fp">Tayyorlash tartibi (har bir qatorga bitta qadam)</label>
    <textarea id="fp" name="steps" required placeholder="Sabzavotlarni to‘g‘rang.&#10;Aralashtirib suving."></textarea>
    <div class="actions"><button class="save" type="submit">Saqlash</button><button class="cancel" type="button" id="cancel">Bekor qilish</button></div>
  </form>
</dialog>

<script>
// ===== Taomlar ro'yxati: shu yerga yangi taom qo'shing =====
const RECIPES = [
  // --- SALATLAR ---
  {type:"salad",region:"uz",e:"🍅",name:"Achichuk",time:"10 daqiqa",short:"Toshkent usulidagi pomidor va piyoz salati.",
   ing:["4 ta pishgan pomidor","1 ta shirin piyoz","Ko‘kat (rayhon, jambil)","Tuz, qora murch"],
   steps:["Pomidorni juda yupqa to‘g‘rang.","Piyozni yarim halqa qilib tuzlab, 5 daqiqa qoldiring.","Hammasini aralashtiring, ko‘kat sepib suving."]},
  {type:"salad",region:"uz",e:"🥩",name:"Toshkent salati",time:"40 daqiqa",short:"Mol go‘shti, turp va sabzili to‘yimli salat.",
   ing:["200 g mol go‘shti","1 ta yashil turp","1 ta sabzi","1 ta piyoz","Mayonez yoki qatiq, tuz"],
   steps:["Go‘shtni yumshaguncha qaynatib, sovitib, ingichka to‘g‘rang.","Turp va sabzini somoncha qilib to‘g‘rang.","Piyozni sirka va tuzda 10 daqiqa ushlang.","Hammasini sous bilan aralashtiring."]},
  {type:"salad",region:"uz",e:"🥕",name:"Koreyscha sabzi",time:"20 daqiqa",short:"O‘zbekiston dasturxonlarining sevimli achchiq salati.",
   ing:["500 g sabzi","3 ta sarimsoq","1 osh qoshiq sirka","Koreyscha ziravor, qizil murch","1/3 stakan qizdirilgan moy"],
   steps:["Sabzini maxsus qirg‘ichda uzun qilib qirg‘ang.","Tuz, shakar va sirka qo‘shib ezib qo‘ying.","Sarimsoq va ziravorni soling.","Ustiga qizigan moyni quying, 2 soat dam oldiring."]},
  {type:"salad",region:"eu",e:"🥒",name:"Yunon salati",time:"15 daqiqa",short:"Yengil, tetiklantiruvchi yozgi salat.",
   ing:["2 ta pomidor","1 ta bodring","1 ta qizil piyoz","Zaytun va feta pishlog‘i","Zaytun moyi, oregano, tuz"],
   steps:["Sabzavotlarni yirik kesing.","Piyozni yupqa halqa qilib qo‘shing.","Ustiga zaytun va pishloqni joylang.","Moy va oregano bilan ziravorlang."]},
  {type:"salad",region:"eu",e:"🍗",name:"Sezar salati",time:"20 daqiqa",short:"Tovuqli va qarsildoq nonli klassika.",
   ing:["Romen salat bargi","1 ta tovuq filesi","Non kublari","Parmezan","Sezar sousi"],
   steps:["Tovuqni tuz-murch bilan qovurib, bo‘laklang.","Non kublarini quruq tovada qarsildoq qiling.","Bargni sous bilan aralashtiring.","Tovuq, non va parmezan bilan bezang."]},
  {type:"salad",region:"eu",e:"🧀",name:"Kaprezе",time:"10 daqiqa",short:"Italiyaning uch rangli salati: pomidor, mozzarella, rayhon.",
   ing:["3 ta pomidor","2 ta mozzarella","Rayhon bargi","Zaytun moyi","Tuz, qora murch"],
   steps:["Pomidor va mozzarellani doira qilib kesing.","Navbat bilan likopchaga tizing.","Rayhon bargini qo‘ying.","Moy va murch bilan ziravorlang."]},
  {type:"salad",region:"eu",e:"🥔",name:"Olivye",time:"50 daqiqa",short:"Bayram dasturxonining doimiy salati.",
   ing:["3 ta kartoshka","2 ta sabzi","4 ta tuxum","Kolbasa yoki tovuq","Tuzlangan bodring, no‘xat, mayonez"],
   steps:["Kartoshka, sabzi va tuxumni qaynatib sovuting.","Hammasini bir xil mayda kubik qilib to‘g‘rang.","No‘xat va bodringni qo‘shing.","Mayonez bilan aralashtirib, sovutgichda 1 soat qoldiring."]},
  {type:"salad",region:"eu",e:"🐟",name:"Shuba (seld ostida)",time:"60 daqiqa",short:"Qatlam-qatlam tuzilgan, qishki bayram salati.",
   ing:["1 ta tuzlangan seld","3 ta kartoshka","2 ta sabzi","2 ta lavlagi","Piyoz, mayonez"],
   steps:["Sabzavotlarni qaynatib, alohida qirg‘ang.","Likopga ketma-ket: seld, piyoz, kartoshka, sabzi, lavlagi.","Har qatlamni mayonez bilan surting.","Kamida 3 soat sovutgichda ivitib qo‘ying."]},
  {type:"salad",region:"eu",e:"🥬",name:"Vinegret",time:"40 daqiqa",short:"Qaynatilgan sabzavotlardan to‘yimli salat.",
   ing:["2 ta lavlagi","2 ta kartoshka","1 ta sabzi","Tuzlangan bodring","Piyoz, o‘simlik moyi"],
   steps:["Lavlagi, kartoshka va sabzini yumshaguncha qaynating.","Sovitib, mayda kubik qilib to‘g‘rang.","Bodring va piyozni qo‘shing.","Moy bilan aralashtiring."]},
  // --- PISHIRIQLAR VA SHIRINLIKLAR ---
  {type:"bake",region:"uz",e:"🍯",name:"Chak-chak",time:"60 daqiqa",short:"Asalga bo‘kkan, bayramlarning an’anaviy shirinligi.",
   ing:["3 stakan un","4 ta tuxum","Qovurish uchun moy","1 stakan asal","1/2 stakan shakar"],
   steps:["Tuxum va un bilan qattiq xamir qoring.","Ingichka tayoqchalar qilib kesing, moyda tilla rang qovuring.","Asal va shakarni qaynatib quyuqlashtiring.","Tayoqchalarni sirop bilan aralashtirib, tog‘ shaklida shakllang."]},
  {type:"bake",region:"uz",e:"🍮",name:"Un halvasi",time:"30 daqiqa",short:"Oddiy, iliq va xushbo‘y uy halvasi.",
   ing:["1 stakan un","100 g sariyog‘","1 stakan shakar","2 stakan suv","Yong‘oq"],
   steps:["Shakar va suvdan sirop qaynating.","Sariyog‘da unni oltin rang bo‘lguncha qovuring.","Siropni asta quying, aralashtirib quyuqlashtiring.","Yong‘oq sepib iliq yoki sovuq tortiq qiling."]},
  {type:"bake",region:"uz",e:"🥮",name:"Jo‘xori pechenyesi",time:"30 daqiqa",short:"Oddiy, to‘yimli va tez tayyorlanadi.",
   ing:["2 stakan jo‘xori yopig‘i","1 ta banan","Quritilgan mevalar","Asal, dolchin"],
   steps:["Bananni ezib, qolgan masalliqlar bilan aralashtiring.","Ho‘llangan qo‘l bilan dumaloqlab, patnisga yoying.","180° da 15 daqiqa pishiring."]},
  {type:"bake",region:"uz",e:"🥐",name:"Pishloqli bulochka",time:"90 daqiqa",short:"Nonushta uchun yumshoq bulochkalar.",
   ing:["500 g un","1 stakan iliq sut","7 g xamirturush","Tuxum, sariyog‘","Brinza yoki mozzarella"],
   steps:["Xamirni qorib, 40 daqiqa ko‘tarilishini kuting.","Bo‘laklarga bo‘lib, ichiga pishloq soling.","Tuxum surtib, 20 daqiqa dam bering.","190° da 20 daqiqa pishiring."]},
  {type:"bake",region:"uz",e:"🍎",name:"Olmali pirog",time:"60 daqiqa",short:"Uy sharoitidagi oddiy va xushbo‘y shirinlik.",
   ing:["3 ta tuxum","1 stakan shakar","1 stakan un","3–4 ta olma","Dolchin"],
   steps:["Tuxum bilan shakarni quyuq ko‘pik bo‘lguncha ko‘piriting.","Unni asta qo‘shib aralashtiring.","Qolipga olmani joylab, xamirni quying.","180° da 35–40 daqiqa pishiring."]},
  {type:"bake",region:"eu",e:"🍫",name:"Trüfel",time:"30 daqiqa + sovitish",short:"Kakaoga o‘ralgan, og‘izda eriydigan shokolad to‘plari.",
   ing:["200 g qora shokolad","100 ml qaymoq (20–30%)","30 g sariyog‘","Kakao kukuni"],
   steps:["Qaymoqni qaynashidan oldin isiting, shokolad ustiga quying.","Aralashtirib silliq massa qiling, sariyog‘ qo‘shing.","Sovutgichda 2 soat qotiring.","Kichik sharchalar yasab, kakaoga ag‘daring."]},
  {type:"bake",region:"eu",e:"🍰",name:"Napoleon torti",time:"2 soat",short:"Yupqa qatlamli, qaymoqli klassik tort.",
   ing:["500 g un","250 g margarin yoki sariyog‘","1 stakan suv","Qaymoq uchun: 1 l sut, 4 sariq, shakar, un"],
   steps:["Xamirni qorib, 10 ta yupqa qatlam yoying.","Har birini 200° da tilla rang bo‘lguncha pishiring.","Sut, sariq va undan quyuq qaymoq pishiring.","Qatlamlarni qaymoq bilan yig‘ib, bir kecha ivitib qo‘ying."]},
  {type:"bake",region:"eu",e:"🍯",name:"Medovik",time:"2 soat",short:"Asalli qatlamlar va smetanali qaymoq.",
   ing:["3 osh qoshiq asal","3 ta tuxum","1 stakan shakar","3 stakan un","Smetana va shakar kukuni"],
   steps:["Asal, shakar va tuxumni suv hammomida isiting.","Un qo‘shib xamir qoring, 8 ta yupqa qatlam pishiring.","Smetanani shakar kukuni bilan ko‘piriting.","Qatlamlarni surib, kamida 6 soat ivitib qo‘ying."]},
  {type:"bake",region:"eu",e:"☕",name:"Tiramisu",time:"30 daqiqa + sovitish",short:"Qahva va mascarpone bilan italyancha shirinlik.",
   ing:["250 g mascarpone","3 ta tuxum sarig‘i","60 g shakar","Savoyardi pechenyesi","Kuchli qahva, kakao"],
   steps:["Sariq va shakarni oqarguncha ko‘piriting, mascarpone qo‘shing.","Pechenyeni qahvaga bir lahzaga botiring.","Qolipga pechenye va krem qatlamlarini joylang.","Kakao sepib, 6 soat sovutgichda saqlang."]},
  {type:"bake",region:"eu",e:"🧁",name:"Chizkeyk",time:"1 soat + sovitish",short:"Yumshoq qaymoqli pishloq tort.",
   ing:["200 g pechenye","80 g sariyog‘","500 g qaymoqli pishloq","3 ta tuxum","3/4 stakan shakar"],
   steps:["Pechenye maydasini sariyog‘ bilan aralashtirib, qolipga bosing.","Pishloq, tuxum va shakarni silliq aralashtiring.","Asosga quying, 160° da 45 daqiqa pishiring.","Sovitib, kamida 4 soat sovutgichda qoldiring."]},
  {type:"bake",region:"eu",e:"🍫",name:"Shokoladli brauni",time:"45 daqiqa",short:"Ichi yumshoq, usti yupqa qatlamli.",
   ing:["150 g shokolad","100 g sariyog‘","2 ta tuxum","3/4 stakan shakar","1/2 stakan un"],
   steps:["Shokolad va sariyog‘ni eritib sovitting.","Tuxum va shakarni qo‘shing.","Unni aralashtiring va qolipga quying.","175° da 25 daqiqa pishiring."]}
];
// ===========================================================

const $ = s => document.querySelector(s);
let type = "salad", favOnly = false, query = "", region = "all";
let favs = [];
try { favs = JSON.parse(localStorage.getItem("favs") || "[]"); } catch (e) {}
let custom = [];
try { custom = JSON.parse(localStorage.getItem("custom") || "[]"); } catch (e) {}
const saveCustom = () => { try { localStorage.setItem("custom", JSON.stringify(custom)); } catch (e) {} };
const saveFavs = () => { try { localStorage.setItem("favs", JSON.stringify(favs)); } catch (e) {} };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render() {
  const q = query.trim().toLowerCase();
  const items = [...RECIPES, ...custom].filter(r => r.type === type && (region === "all" || r.region === region)
    && (!favOnly || favs.includes(r.name))
    && (!q || (r.name + " " + r.ing.join(" ")).toLowerCase().includes(q)));
  $("#list").innerHTML = items.length ? items.map((r, i) => `
    <li class="item" data-name="${esc(r.name)}">
      <button class="head" aria-expanded="false" aria-controls="b${i}">
        <span class="sticker" aria-hidden="true">${r.e}</span><span class="name">${esc(r.name)}</span><span class="dots"></span><span class="time">${esc(r.time)}</span>
      </button>
      <div class="body" id="b${i}"><div class="inner">
        ${r.short ? `<p class="short">${esc(r.short)}</p>` : ""}
        <div class="cols">
          <div><h3>Masalliqlar</h3><ul>${r.ing.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
          <div><h3>Tayyorlash</h3><ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
        </div>
        <button class="star" aria-pressed="${favs.includes(r.name)}">${favs.includes(r.name) ? "Sevimlilarda" : "Sevimlilarga qo‘shish"}</button><button class="send">Mijozlar menyusiga yuborish</button>${r.custom ? `<button class="del">O‘chirish</button>` : ""}
      </div></div>
    </li>`).join("") : `<li class="empty">${favOnly ? "Hali sevimli taom tanlanmagan." : "Hech narsa topilmadi."}</li>`;
}

$("#list").addEventListener("click", e => {
  const li = e.target.closest(".item"); if (!li) return;
  if (e.target.closest(".head")) {
    const open = li.classList.toggle("open");
    li.querySelector(".head").setAttribute("aria-expanded", open);
  } else if (e.target.closest(".send")) {
    const n = li.dataset.name, r = [...RECIPES, ...custom].find(x => x.name === n);
    const v = prompt("“" + n + "” narxi (so‘m):");
    if (v === null) return;
    const price = Math.round(Number(String(v).replace(/\s/g, "")));
    if (!String(v).trim() || isNaN(price) || price < 0) { alert("Narxni raqam bilan kiriting."); return; }
    let p = []; try { p = JSON.parse(localStorage.getItem("pendingItems") || "[]"); } catch (x) {}
    p = p.filter(x => x.name !== n); p.push({type: r.type, e: r.e, name: n, price, desc: r.short || ""});
    try { localStorage.setItem("pendingItems", JSON.stringify(p)); e.target.textContent = "Yuborildi ✓"; } catch (x) { alert("Saqlab bo‘lmadi."); }
  } else if (e.target.closest(".del")) {
    const n = li.dataset.name;
    if (confirm("“" + n + "” retsepti o‘chirilsinmi?")) {
      custom = custom.filter(x => x.name !== n);
      saveCustom(); render();
    }
  } else if (e.target.closest(".star")) {
    const n = li.dataset.name;
    favs = favs.includes(n) ? favs.filter(x => x !== n) : [...favs, n];
    saveFavs();
    const b = e.target.closest(".star"), on = favs.includes(n);
    b.setAttribute("aria-pressed", on);
    b.textContent = on ? "Sevimlilarda" : "Sevimlilarga qo‘shish";
  }
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  type = t.dataset.type;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  render();
}));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  region = c.dataset.region;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  render();
}));
const dlg = $("#dlg"), f = $("#f");
$("#addBtn").addEventListener("click", () => { f.reset(); dlg.showModal(); $("#fn").focus(); });
$("#cancel").addEventListener("click", () => dlg.close());
f.addEventListener("submit", e => {
  e.preventDefault();
  const d = new FormData(f);
  const lines = k => String(d.get(k)).split("\n").map(x => x.trim()).filter(Boolean);
  const t = d.get("type");
  const r = { custom: true, type: t, region: d.get("region"),
    e: String(d.get("e")).trim() || (t === "salad" ? "🥗" : "🍰"),
    name: String(d.get("name")).trim(), time: String(d.get("time")).trim() || "—",
    short: String(d.get("short")).trim(), ing: lines("ing"), steps: lines("steps") };
  if (!r.name || !r.ing.length || !r.steps.length) return;
  custom.push(r); saveCustom();
  type = t; region = "all"; favOnly = false; query = ""; $("#q").value = "";
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.type === t));
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.region === "all"));
  $("#favOnly").setAttribute("aria-pressed", "false");
  dlg.close(); render();
  const li = [...document.querySelectorAll(".item")].find(x => x.dataset.name === r.name);
  if (li) { li.classList.add("open"); li.querySelector(".head").setAttribute("aria-expanded", "true"); li.scrollIntoView({block:"center"}); }
});
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#favOnly").addEventListener("click", e => {
  favOnly = !favOnly; e.target.setAttribute("aria-pressed", favOnly); render();
});
render();
</script>
</body>
</html>
